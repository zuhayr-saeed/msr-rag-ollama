# GraphRAG Pipeline Configuration
# ================================
# All sensitive values (passwords, API keys) are read from environment variables.

# Ollama LLM Configuration
ollama {
  endpoint = "http://localhost:11434"
  endpoint = ${?OLLAMA_ENDPOINT}
  model = "llama3.2:latest"
  model = ${?OLLAMA_MODEL}
  temperature = 0.0
  timeoutMs = 30000
}

# Neo4j Database Configuration
neo4j {
  uri = "bolt://localhost:7687"
  uri = ${?NEO4J_URI}
  user = "neo4j"
  user = ${?NEO4J_USER}
  # Password is read from NEO4J_PASS environment variable (default: password123)
  passEnv = "NEO4J_PASS"
}

# Index/Data Source Configuration
index {
  source = "data/chunks.tsv"
  source = ${?MSR_CHUNK_FILE}
  format = "tsv"
}

# Relation Extraction Configuration
relation {
  # Co-occurrence configuration
  cooccur {
    window = 3
    minPmi = 0.2
  }
  
  # LLM relation scoring configuration
  llm {
    predicateSet = ["is_a", "part_of", "causes", "synonym_of", "related_to"]
    minConfidence = 0.65
  }
}

# GraphRAG Query Service Configuration
graphrag {
  api {
    host = "0.0.0.0"
    host = ${?API_HOST}
    port = 8080
    port = ${?API_PORT}
  }
  
  # Flink configuration
  flink {
    parallelism = 2
    parallelism = ${?FLINK_PARALLELISM}
    checkpointIntervalMs = 60000
  }
}

