# NOTE: Each setting has a default and an env override below it.
# The env override uses ${?ENV_VAR} so it only applies if set.

app {
  inputDir = "/mnt/c/Users/Zuhayr/Downloads/MSRCorpus"
  inputDir = ${?RAG_INPUT_DIR}

  db {
    url  = "jdbc:postgresql://127.0.0.1:5432/rag"
    url  = ${?RAG_DB_URL}
    user = "rag"
    user = ${?RAG_DB_USER}
    pass = "rag"
    pass = ${?RAG_DB_PASS}
  }

  embed {
    url       = "http://127.0.0.1:11434/api/embed"
    url       = ${?RAG_EMBED_URL}
    model     = "mxbai-embed-large"
    model     = ${?RAG_EMBEDDER}
    version   = "1.3.0"
    version   = ${?RAG_EMBEDDER_VER}
    batchSize = 64
    batchSize = ${?RAG_BATCH_SIZE}
  }

  search {
    topK = 5
    topK = ${?TOPK}
  }
}
